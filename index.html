<title>인치 계산기</title>
<style>
  :root{
    --bg:#0d1117; --num:#1f2732; --num-a:#3a4758; --fn:#3b4a5c; --fn-a:#55687e;
    --op:#ffc928; --op-a:#ffe38a; --inch:#0f5f57; --inch-a:#18877c;
    --gap:12px;
    --w:calc((min(100vw, 440px) - 5*var(--gap)) / 4);
    --ih:calc(var(--w) * .6);
    --b:min(var(--w), calc((100dvh - 294px - var(--ih) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) / 5 - var(--gap)));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Apple SD Gothic Neo",sans-serif;
    user-select:none;-webkit-user-select:none;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  body{position:fixed;inset:0;width:100%}
  *{scrollbar-width:none}
  *::-webkit-scrollbar{display:none;width:0;height:0}
  .app{height:100%;overflow:hidden;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding:calc(26px + env(safe-area-inset-top)) var(--gap) calc(var(--gap) + 6px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .prec .pl{color:#9fb0c3;font-weight:500;margin-right:5px}
  .prec{border:0;background:#1a212b;color:#ffc928;font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border-radius:9px;cursor:pointer}
  .seg{display:flex;background:#1a212b;border-radius:9px;padding:2px}
  .seg button{border:0;background:transparent;color:#bbb;font:inherit;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer}
  .seg button.on{background:#ffc928;color:#14181f;font-weight:600}
  .opts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;transition:opacity .2s}
  .opts.hide{opacity:0;pointer-events:none;height:0;margin:0;overflow:hidden}
  .opts .seg button{font-size:12px;padding:5px 9px}
  .screen{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;min-height:130px;padding:0 8px 10px}
  .screen{position:relative}
  .pullhint{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));text-align:center;font-size:14px;color:#7d8a99;opacity:0;transition:opacity .15s;pointer-events:none}
  #app{transition:transform .35s cubic-bezier(.2,.9,.3,1);will-change:transform}
  #app.drag{transition:none}
  .pullhint.ready{color:#ffc928}
  .expr{color:#7d8a99;font-size:20px;text-align:right;min-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
  .main{flex:0 0 auto;color:#f4f1e8;font-weight:300;text-align:right;white-space:nowrap;overflow-x:hidden;overflow-y:visible;line-height:1.2;padding:4px 0;font-size:64px;letter-spacing:-1px}
  .expr,.conv{flex:0 0 auto}
  .pad{flex:0 0 auto}
  .conv{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;margin-top:8px;min-height:26px;direction:rtl}
  .conv::-webkit-scrollbar{display:none}
  .chip{direction:ltr;flex:0 0 auto}
  .chip{background:#18202a;color:#cfe3f0;border:1px solid #263243;border-radius:12px;padding:4px 9px;font-size:13px;font-variant-numeric:tabular-nums}
  .chip.rnd{background:transparent;border:1px dashed #3a4a5e;color:#8a9bb0}
  .chip b{color:#ffc928;font-weight:500;margin-left:4px}
  .err{color:#ff6961}
  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
  .k{height:var(--b);border:0;border-radius:999px;font:inherit;font-size:calc(var(--b)*.42);color:#fff;background:var(--num);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s}
  .k:active,.k.press{transition:none}
  .k.n:active{background:var(--num-a)}
  .k.f{background:var(--fn);color:#f2f5f9;font-size:calc(var(--b)*.37);font-weight:500;letter-spacing:-.3px}
  .k.f:active{background:var(--fn-a)}
  .k.o{background:var(--op);color:#14181f}
  .k .op{width:calc(var(--b)*.42);height:calc(var(--b)*.42);display:block}
  .k.n{font-size:calc(var(--b)*.46);font-weight:400;font-variant-numeric:tabular-nums}
  .k.o:active{background:var(--op-a)}
  .k.o.sel{background:#14181f;color:var(--op);box-shadow:inset 0 0 0 2px var(--op)}
  .k.i{height:var(--ih);background:var(--inch);font-size:calc(var(--ih)*.4);flex-direction:row;gap:4px;line-height:1;padding:0 4px}
  .k.i small{font-size:clamp(15px, calc(var(--w)*.2), 19px);font-weight:600;color:#bff3ea;white-space:nowrap}
  .k.i:active{background:var(--inch-a)}
  .k.i.del{background:#7a2f33}
  .k.i.del:active{background:#a8444a}
  .k.i.del small{color:#ffd9d4}
  .k.zero{grid-column:span 2;justify-content:flex-start;padding:0}
  .k.zero span{width:var(--w);text-align:center}
  .k.i.dis{opacity:.35}
  .pm{width:calc(var(--b)*.5);height:calc(var(--b)*.5);display:block}
  .irow{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
  .ver{flex:0 0 auto;text-align:center;color:#4f5d6e;font-size:11px;margin-top:18px;letter-spacing:.2px}
  .irow.hide{display:none}
</style>
</head>
<body>
<div class="pullhint" id="pullhint">↓ 당겨서 지우기</div>
<div class="app" id="app">
  <div class="top">
    <div class="seg" id="modeSeg">
      <button data-mode="std">일반</button>
      <button data-mode="inch">인치</button>
    </div>
    <button class="prec" id="precBtn">1/16</button>
    <div class="seg" id="fmtSeg">
      <button data-fmt="in">in</button>
      <button data-fmt="cm">cm</button>
    </div>
  </div>

  <div class="screen" id="screen">
    <div class="expr" id="expr"></div>
    <div class="main" id="main">0</div>
    <div class="conv" id="conv"></div>
  </div>

  <div class="pad" id="pad">
    <div class="irow" id="irow">
      <button class="k i" data-k="in"><small>inch</small></button>
      <button class="k i" data-k="frac"><small>a/b</small></button>
      <button class="k i del" data-k="back"><small>Clear</small></button>
    </div>
    <button class="k f" data-k="ac" id="acKey">AC</button>
    <button class="k f" data-k="neg"><svg class="pm" viewBox="0 0 40 40" aria-label="plus minus"><g stroke="currentColor" stroke-width="3.4" stroke-linecap="round" fill="none"><path d="M11 5v13M4.5 11.5h13"/><path d="M13 28 L28 13"/><path d="M23 30h13"/></g></svg></button>
    <button class="k f" data-k="pct">%</button>
    <button class="k o" data-k="÷"><svg class="op" viewBox="0 0 40 40"><g stroke="currentColor" stroke-width="4.2" stroke-linecap="round" fill="none"><path d="M8 20h24"/></g><circle cx="20" cy="10.5" r="3" fill="currentColor"/><circle cx="20" cy="29.5" r="3" fill="currentColor"/></svg></button>
    <button class="k n" data-k="7">7</button>
    <button class="k n" data-k="8">8</button>
    <button class="k n" data-k="9">9</button>
    <button class="k o" data-k="×"><svg class="op" viewBox="0 0 40 40"><g stroke="currentColor" stroke-width="4.2" stroke-linecap="round" fill="none"><path d="M11.5 11.5L28.5 28.5M28.5 11.5L11.5 28.5"/></g></svg></button>
    <button class="k n" data-k="4">4</button>
    <button class="k n" data-k="5">5</button>
    <button class="k n" data-k="6">6</button>
    <button class="k o" data-k="−"><svg class="op" viewBox="0 0 40 40"><g stroke="currentColor" stroke-width="4.2" stroke-linecap="round" fill="none"><path d="M8 20h24"/></g></svg></button>
    <button class="k n" data-k="1">1</button>
    <button class="k n" data-k="2">2</button>
    <button class="k n" data-k="3">3</button>
    <button class="k o" data-k="+"><svg class="op" viewBox="0 0 40 40"><g stroke="currentColor" stroke-width="4.2" stroke-linecap="round" fill="none"><path d="M20 8v24M8 20h24"/></g></svg></button>
    <button class="k n zero" data-k="0"><span>0</span></button>
    <button class="k n" data-k=".">.</button>
    <button class="k o" data-k="="><svg class="op" viewBox="0 0 40 40"><g stroke="currentColor" stroke-width="4.2" stroke-linecap="round" fill="none"><path d="M8 14.5h24M8 25.5h24"/></g></svg></button>
  </div>
  <div class="ver">Version 2.0 · Nov 13, 2026</div>
</div>

<script>
(() => {
  // ---------- settings ----------
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('inchcalc.'+k); return v==null?d:v; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem('inchcalc.'+k, v); }catch(e){} }
  };
  let mode = store.get('mode','inch');   // std | inch
  let fmt  = store.get('fmt','in');    // in | cm
  if (fmt !== 'cm') fmt = 'in';
  let prec = +store.get('prec','16');

  // ---------- calculator state ----------
  // value: {v:number, dim:0 number | 1 length(in) | 2 area(sq in)}
  let acc = null, op = null, buf = '', neg = false, entering = false;
  let shown = {v:0, dim:0}, lastOp = null, lastB = null, exprText = '', error = null;

  const $ = id => document.getElementById(id);

  // ---------- parsing entry ----------
  function parseEntry(){
    let ft = 0, inch = 0, num = '', unit = false, fracN = null;
    for (const ch of buf){
      if (/[0-9.]/.test(ch)) num += ch;
      else if (ch === "'"){ ft += +num || 0; num=''; unit = true; }
      else if (ch === '"'){ inch += +num || 0; num=''; unit = true; }
      else if (ch === '/'){ fracN = +num || 0; num=''; unit = true; }
    }
    if (fracN !== null){
      const d = +num;
      if (d > 0) inch += fracN / d;
      else if (num === '' && fracN) {/* denominator not typed yet */}
      num = '';
    }
    let v, dim;
    if (unit || mode === 'inch' && false){ v = ft*12 + inch + (+num || 0); dim = 1; }
    else { v = +num || 0; dim = 0; }
    return {v: neg ? -v : v, dim};
  }

  function prettyBuf(){
    if (!buf) return (neg?'-':'') + '0';
    let s = buf;
    // whole inches followed by fraction:  7"3/4  ->  7 3/4"
    s = s.replace(/(\d*\.?\d*)"(\d+\/\d*)$/, (m,a,f) => (a ? a+' ' : '') + f + '"');
    s = s.replace(/'(?=\S)/g, "' ").replace(/"(?=\S)/g, '" ');
    // bare fraction at end in inch context gets shown as typed
    s = s.replace(/(\d+)(?=(\.\d*)?$)/, m => m); // keep
    // thousands separators for pure numbers
    if (/^\d*\.?\d*$/.test(s)) {
      const [i, d] = s.split('.');
      s = (i ? (+i).toLocaleString('en-US') : '0') + (s.includes('.') ? '.' + d : '');
    }
    return (neg?'-':'') + s;
  }

  // ---------- math ----------
  function apply(a, o, b){
    let dim, v;
    if (o === '+' || o === '−'){
      if (a.dim === b.dim) dim = a.dim;
      else if (a.dim === 0 || b.dim === 0) dim = Math.max(a.dim, b.dim); // bare number = inches
      else throw '단위 오류';
      v = o === '+' ? a.v + b.v : a.v - b.v;
    } else if (o === '×'){
      dim = a.dim + b.dim; if (dim > 2) throw '단위 오류';
      v = a.v * b.v;
    } else {
      if (b.v === 0) throw '오류';
      dim = a.dim - b.dim; if (dim < 0) throw '단위 오류';
      v = a.v / b.v;
    }
    return {v: +v.toPrecision(15), dim};
  }

  // ---------- formatting ----------
  function fmtNum(x, maxSig = 10){
    if (!isFinite(x)) return '오류';
    if (x === 0) return '0';
    const ax = Math.abs(x);
    if (ax >= 1e15 || ax < 1e-9) return x.toExponential(5).replace(/\.?0+e/, 'e');
    let s = (+x.toPrecision(maxSig)).toString();
    if (s.includes('e')) return s;
    const [i, d] = s.split('.');
    return (+i < 0 || s.startsWith('-') ? '-' : '') + Math.abs(+i).toLocaleString('en-US') + (d ? '.' + d : '');
  }
  function gcd(a,b){ return b ? gcd(b, a % b) : a; }
  function fracParts(inches){
    const n = Math.round(Math.abs(inches) * prec);
    const whole = Math.floor(n / prec);
    let fn = n % prec, fd = prec;
    if (fn){ const g = gcd(fn, fd); fn /= g; fd /= g; }
    const approx = Math.abs(Math.abs(inches) - n/prec) > 1e-9;
    return {whole, fn, fd, approx, sign: inches < 0 && n > 0 ? '-' : ''};
  }
  function fmtLen(inches, style = fmt){
    if (style === 'cm') return fmtNum(inches * 2.54, 8) + ' cm';
    const p = fracParts(inches);
    const fr = p.fn ? `${p.fn}/${p.fd}` : '';
    let s;
    if (style === 'in'){
      s = (p.whole || !fr ? p.whole.toLocaleString('en-US') : '') + (p.whole && fr ? ' ' : '') + fr + '"';
    } else {
      const ft = Math.floor(p.whole / 12), inch = p.whole % 12;
      const inPart = (inch || !fr ? inch : '') + (inch && fr ? ' ' : '') + fr + '"';
      s = ft ? `${ft.toLocaleString('en-US')}' ${inPart}` : inPart;
    }
    return p.sign + s;
  }
  function fmtVal(x, style){
    if (x.dim === 1) return fmtLen(x.v, style);
    if (x.dim === 2) return fmtNum(x.v / 144, 8) + ' sq ft';
    return fmtNum(x.v);
  }

  // ---------- render ----------
  function render(){
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    document.querySelectorAll('#fmtSeg button').forEach(b => b.classList.toggle('on', b.dataset.fmt === fmt));
    $('precBtn').innerHTML = '<span class="pl">눈금</span>1/' + prec;
    $('precBtn').style.visibility = mode === 'inch' ? 'visible' : 'hidden';
    $('fmtSeg').style.visibility = mode === 'inch' ? 'visible' : 'hidden';
        $('irow').classList.toggle('hide', mode !== 'inch');

    const main = $('main'), conv = $('conv');
    main.classList.toggle('err', !!error);
    let cur;
    if (error){ main.textContent = error; cur = null; }
    else if (entering){ main.textContent = prettyBuf(); cur = parseEntry(); }
    else { cur = shown; main.textContent = fmtVal(shown); }

    $('expr').textContent = exprText;
    $('acKey').textContent = (entering && (buf || neg)) ? 'C' : 'AC';
    document.querySelectorAll('.k.o').forEach(k => k.classList.toggle('sel', !entering && op === k.dataset.k && !error));

    // conversions
    conv.innerHTML = '';
    if (mode === 'inch' && cur && cur.dim === 1){
      const items = [];
      if (!entering && fmt !== 'cm' && fracParts(cur.v).approx){ const n = document.createElement('span'); n.className = 'chip rnd'; n.textContent = '1/' + prec + ' 반올림'; conv.appendChild(n); }
      if (fmt !== 'in')   items.push([fmtLen(cur.v,'in'), '']);
      items.push([fmtNum(cur.v, 8), 'in']);
      items.push([fmtNum(cur.v*25.4, 8), 'mm']);
      if (fmt !== 'cm') items.push([fmtNum(cur.v*2.54, 8), 'cm']);
      items.forEach(([a,u]) => { const c = document.createElement('span'); c.className='chip'; c.innerHTML = a + (u?`<b>${u}</b>`:''); conv.appendChild(c); });
    } else if (mode === 'inch' && cur && cur.dim === 2){
      [[fmtNum(cur.v, 8),'sq in'],[fmtNum(cur.v*0.00064516, 6),'m²']].forEach(([a,u]) => {
        const c = document.createElement('span'); c.className='chip'; c.innerHTML = a + `<b>${u}</b>`; conv.appendChild(c); });
    }
    fit(main);
  }
  function fit(el){
    let size = Math.min(76, Math.max(36, window.innerWidth * 0.19));
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > el.clientWidth && size > 22){ size -= 2; el.style.fontSize = size + 'px'; }
  }

  // ---------- input ----------
  function startEntry(){ if (!entering){ buf=''; neg=false; entering=true; error=null; if (!op){ acc=null; exprText=''; } } }

  function press(k){
    if (error && k !== 'ac' && !/^[0-9.]$/.test(k)) return;
    if (/^[0-9]$/.test(k)){
      startEntry();
      if (buf.length >= 22) return;
      if (buf === '0') buf = '';
      buf += k;
    } else if (k === '.'){
      startEntry();
      const seg = buf.split(/['"\/]/).pop();
      if (seg.includes('.')) return;
      if (/\/\d*$/.test(buf)) return;
      buf += seg === '' ? '0.' : '.';
    } else if (k === 'ft' || k === 'in'){
      if (!entering || !/[0-9.]$/.test(buf)) return;
      if (k === 'ft' && /['"\/]/.test(buf)) return;
      if (k === 'in' && /["\/]/.test(buf)) return;
      buf += k === 'ft' ? "'" : '"';
    } else if (k === 'frac'){
      if (!entering || !/\d$/.test(buf) || buf.includes('/')) return;
      // digits typed after ' with no " : treat as fraction numerator only if they are the last group
      buf += '/';
    } else if (k === 'back'){
      if (!entering) return;
      buf = buf.slice(0, -1);
    } else if (k === 'neg'){
      if (entering) neg = !neg;
      else { shown = {v: -shown.v, dim: shown.dim}; if (!op) acc = null; else acc = shown; }
    } else if (k === 'pct'){
      const v = entering ? parseEntry() : shown;
      let r;
      if (acc && op && (op === '+' || op === '−') && v.dim === 0) r = {v: acc.v * v.v / 100, dim: acc.dim};
      else r = {v: v.v / 100, dim: v.dim};
      shown = r; entering = false;
      if (op) { /* keep as second operand */ lastB = r; pendingB = r; }
    } else if (k === 'ac'){
      if (entering && (buf || neg)){ buf=''; neg=false; }
      else { acc=null; op=null; buf=''; neg=false; entering=false; shown={v:0,dim:0}; lastOp=null; lastB=null; exprText=''; error=null; pendingB=null; }
    } else if ('+−×÷'.includes(k)){
      try{
        const b = entering ? parseEntry() : (pendingB || null);
        if (acc && op && b){ acc = apply(acc, op, b); }
        else if (!acc || !op){ acc = b || shown; }
        op = k; entering = false; pendingB = null; shown = acc;
        exprText = fmtVal(acc) + ' ' + k;
      }catch(e){ fail(e); }
    } else if (k === '='){
      try{
        if (op){
          const b = entering ? parseEntry() : (pendingB || acc);
          const r = apply(acc, op, b);
          exprText = fmtVal(acc) + ' ' + op + ' ' + fmtVal(b) + ' =';
          lastOp = op; lastB = b; shown = r; acc = null; op = null;
        } else if (lastOp){
          const a = entering ? parseEntry() : shown;
          const r = apply(a, lastOp, lastB);
          exprText = fmtVal(a) + ' ' + lastOp + ' ' + fmtVal(lastB) + ' =';
          shown = r;
        } else if (entering){ shown = parseEntry(); exprText = ''; }
        entering = false; pendingB = null;
      }catch(e){ fail(e); }
    }
    render();
  }
  let pendingB = null;
  function fail(e){ error = typeof e === 'string' ? e : '오류'; acc=null; op=null; entering=false; lastOp=null; lastB=null; pendingB=null; exprText=''; }

  // ---------- events ----------
  $('pad').addEventListener('click', e => { const b = e.target.closest('.k'); if (b) press(b.dataset.k); });
  $('modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.mode; store.set('mode', mode);
    if (mode === 'std'){ press('ac'); press('ac'); } render(); });
  $('fmtSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; fmt = b.dataset.fmt; store.set('fmt', fmt); render(); });
  $('precBtn').addEventListener('click', () => { prec = {8:16,16:32,32:64,64:8}[prec] || 16; store.set('prec', prec); render(); });

  document.addEventListener('keydown', e => {
    const map = {'*':'×','x':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Escape':'ac','Backspace':'back','%':'pct',"'":'ft','"':'in','f':'frac','.':'.'};
    let k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
    if (e.key === '/' && mode === 'inch' && entering && /\d$/.test(buf) && e.altKey) k = 'frac';
    if (!k) return;
    if ((k === 'ft' || k === 'in' || k === 'frac') && mode !== 'inch') return;
    if (k === 'back' && mode !== 'inch'){ if (entering){ buf = buf.slice(0,-1); render(); } return; }
    e.preventDefault(); press(k);
  });
  window.addEventListener('resize', render);
  document.addEventListener('touchmove', e => { if (!e.target.closest('.conv')) e.preventDefault(); }, {passive:false});

  // tap display to delete last digit (like swiping on iPhone)
  let pulled = false;
  $('main').addEventListener('click', () => { if (pulled){ pulled = false; return; } if (entering && buf){ buf = buf.slice(0,-1); render(); } });

  // pull the whole screen down (like a browser) to clear everything
  (() => {
    const app = $('app'), hint = $('pullhint'), LIM = 80;
    let y0 = null, dy = 0;
    const off = d => d <= LIM ? d * 0.55 : LIM * 0.55 + (d - LIM) * 0.2;
    app.addEventListener('touchstart', e => {
      if (e.target.closest('.k, button')) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0; app.classList.add('drag');
    }, {passive:true});
    app.addEventListener('touchmove', e => {
      if (y0 === null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      app.style.transform = `translateY(${Math.min(off(dy), 110)}px)`;
      hint.style.opacity = Math.min(1, dy / LIM);
      hint.classList.toggle('ready', dy >= LIM);
      hint.textContent = dy >= LIM ? '놓으면 지워져요' : '↓ 당겨서 지우기';
    }, {passive:true});
    const end = () => {
      if (y0 === null) return;
      app.classList.remove('drag'); app.style.transform = ''; hint.style.opacity = 0;
      if (dy > 10) pulled = true;
      if (dy >= LIM){ press('ac'); press('ac'); if (navigator.vibrate) try{ navigator.vibrate(10); }catch(e){} }
      y0 = null; dy = 0;
      setTimeout(() => { pulled = false; }, 400);
    };
    app.addEventListener('touchend', end); app.addEventListener('touchcancel', end);
  })();

  render();
})();
</script>
</body>
</html>
